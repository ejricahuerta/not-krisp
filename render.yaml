services:
  - type: web
    name: not-krisp-backend
    env: docker
    dockerfilePath: app/backend/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
    regions:
      - oregon

  - type: web
    name: not-krisp-frontend
    env: docker
    dockerfilePath: app/frontend/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://not-krisp-backend.onrender.com
    regions:
      - oregon

  - type: web
    name: not-krisp-backend-staging
    env: docker
    dockerfilePath: app/backend/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ASPNETCORE_URLS
        value: http://+:5000
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true
    branch: staging

  - type: web
    name: not-krisp-frontend-staging
    env: docker
    dockerfilePath: app/frontend/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: VITE_API_URL
        value: https://not-krisp-backend-staging.onrender.com
    healthCheckPath: /
    autoDeploy: true
    branch: staging

databases:
  - type: postgres
    name: postgres-db
    plan: starter
    region: oregon
