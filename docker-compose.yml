version: '3.8'

services:
  api:
    build:
      context: ./NotKrisp.Core
      dockerfile: Dockerfile
    ports:
      - "5149:5149"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=notkrisp;Username=postgres;Password=postgres
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notkrisp-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=notkrisp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notkrisp-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: notkrisp-postgres-data

networks:
  notkrisp-network:
    name: notkrisp-network 